[project]
name = "tiny-m87"
version = "0.1.0"
description = "Diameter-conditioned M87 diffusion prior for InverseBench"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ehtim>=1.2.10,<2",
    "h5py>=3.15,<4",
    "hydra-core>=1.3.2,<2",
    "lmdb>=1.7,<2",
    "numpy>=2.1,<3",
    "pandas>=2.3,<4",
    "pillow>=10,<13",
    "piq>=0.8,<1",
    "requests>=2.32,<3",
    "scipy>=1.16,<2",
    "sigpy>=0.1.27,<1",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "tqdm>=4.67,<5",
    "wandb>=0.22,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
